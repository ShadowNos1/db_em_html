<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Factory — интерфейс базы данных</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fa;
            color: #1e2a3a;
            line-height: 1.5;
            padding: 24px 20px;
        }

        .app {
            max-width: 1440px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-bottom: 20px;
            border-bottom: 2px solid #d0d9e8;
            background: transparent;
        }

        .tab-btn {
            background: #e9eef5;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.15s;
            border-radius: 8px 8px 0 0;
            margin-bottom: -2px;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: #dbe3ef;
        }

        .tab-btn.active {
            background: #ffffff;
            border-bottom: 3px solid #2563eb;
            color: #1e3a8a;
            font-weight: 600;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
        }

        .panel {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            padding: 24px 24px 32px;
            border: 1px solid #e2e9f2;
        }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .panel-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0b2a4a;
            letter-spacing: -0.01em;
        }

        .btn {
            background: #ffffff;
            border: 1px solid #b8c9e0;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1e2f44;
            cursor: pointer;
            transition: 0.12s;
            font-family: inherit;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1e4f8a;
            border-color: #1e4f8a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #123b6b;
            border-color: #123b6b;
        }

        .btn-danger {
            background: #ffffff;
            border-color: #d77;
            color: #a33;
        }

        .btn-danger:hover {
            background: #fce8e8;
            border-color: #b33;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 13px;
            border-radius: 6px;
        }

        .btn:hover {
            background: #f0f5fc;
        }

        .btn-primary:hover {
            background: #123b6b;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #dfe7f0;
            background: #fff;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 700px;
        }

        th {
            background: #f0f4fb;
            color: #1f3a5e;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #d0dcec;
            white-space: nowrap;
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #e9eef6;
            vertical-align: middle;
            color: #1e2f44;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8faff;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: #e6edf8;
            color: #1d3a5c;
        }

        .badge-active { background: #dff0df; color: #1a6b2f; }
        .badge-maintenance { background: #fff3d2; color: #8a6100; }
        .badge-offline { background: #f6e0e0; color: #9e2b2b; }

        .empty-row td {
            text-align: center;
            color: #7a8b9f;
            padding: 32px;
            font-style: italic;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
            align-items: flex-end;
            margin: 24px 0 8px;
            padding-top: 16px;
            border-top: 1px solid #e0e8f2;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
            flex: 1 0 120px;
        }

        .form-field label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #4a617c;
        }

        .form-field input, .form-field select {
            padding: 9px 12px;
            border: 1px solid #cbd8e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fbfdff;
            transition: 0.12s;
        }

        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
            background: #ffffff;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .inline-msg {
            font-size: 13px;
            color: #2f6e3f;
            background: #e7f3e7;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 500;
        }

        .error-msg {
            color: #b22;
            background: #fce8e8;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        .action-cell {
            white-space: nowrap;
        }

        .action-cell button {
            margin-right: 4px;
        }

        .query-section {
            margin-top: 28px;
        }

        .query-box {
            background: #f7faff;
            border-radius: 12px;
            padding: 20px 18px;
            border: 1px solid #dde7f3;
        }

        .query-box h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #1f3b60;
        }

        .query-result {
            margin-top: 16px;
            max-height: 320px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #d4e0ef;
            background: #ffffff;
        }

        .query-result table {
            min-width: 500px;
        }

        .query-result th {
            position: sticky;
            top: 0;
            background: #eef3fc;
            z-index: 2;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .muted {
            color: #6b7f96;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="positions">Должности</button>
        <button class="tab-btn" data-tab="employees">Сотрудники</button>
        <button class="tab-btn" data-tab="machines">Станки</button>
        <button class="tab-btn" data-tab="parts">Детали</button>
        <button class="tab-btn" data-tab="orders">Заказы</button>
        <button class="tab-btn" data-tab="shiftTasks">Сменные задания</button>
        <button class="tab-btn" data-tab="queries">Запросы</button>
    </div>

    <div class="panel" id="panel">
        <!-- динамическое содержимое -->
    </div>
</div>

        ],
        orders: [

            { order_id: 4, client_name: 'Robotics Corp', order_date: '2026-10-12', due_date: '2026-11-30', total_amount: 11200.00 },
            { order_id: 5, client_name: 'Energy Systems Ltd', order_date: '2026-10-15', due_date: '2026-12-10', total_amount: 30500.00 },

        ],
        shiftTasks: [
            { task_id: 1, machine_id: 1, part_id: 1, employee_id: 1, order_id: 1, shift_date: '2026-11-20', planned_quantity: 100, actual_quantity: 85 },

            { task_id: 5, machine_id: 6, part_id: 4, employee_id: 3, order_id: 6, shift_date: '2026-11-20', planned_quantity: 120, actual_quantity: 120 },

            { task_id: 7, machine_id: 9, part_id: 9, employee_id: 2, order_id: 7, shift_date: '2026-11-20', planned_quantity: 20, actual_quantity: 15 },
            { task_id: 8, machine_id: 10, part_id: 8, employee_id: 1, order_id: 4, shift_date: '2026-11-20', planned_quantity: 200, actual_quantity: 190 },
            { task_id: 9, machine_id: 1, part_id: 6, employee_id: 3, order_id: 5, shift_date: '2026-11-20', planned_quantity: 150, actual_quantity: 100 },

        ]
    };

    // ======================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ========================
    function nextId(arr, idField) {
        if (!arr.length) return 1;
        return Math.max(...arr.map(x => x[idField])) + 1;
    }

    function findName(collection, idField, idValue, nameField) {
        const item = collection.find(x => x[idField] === idValue);
        return item ? item[nameField] : '—';
    }

    // ======================== КОМПОНЕНТЫ ОТОБРАЖЕНИЯ ========================

    // ----- ПОЗИЦИИ -----
    function renderPositions() {
        const rows = DB.positions.map(p => `
            <tr>
                <td>${p.position_id}</td>
                <td>${p.position_name}</td>
                <td>${p.base_salary.toFixed(2)}</td>
                <td class="action-cell">
                    <button class="btn btn-sm" onclick="editPosition(${p.position_id})">Ред.</button>
                    <button class="btn btn-sm btn-danger" onclick="deletePosition(${p.position_id})">Удал.</button>
                </td>
            </tr>
        `).join('');

        return `
            <div class="panel-header">
                <h2>Должности</h2>
                <button class="btn btn-primary" onclick="addPosition()">+ Добавить должность</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Название</th><th>Базовый оклад</th><th>Действия</th></tr></thead>
                    <tbody>${rows || '<tr class="empty-row"><td colspan="4">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
            <div id="position-form" class="form-grid hidden"></div>
        `;
    }

    // ----- СОТРУДНИКИ -----
    function renderEmployees() {
        const rows = DB.employees.map(e => {
            const posName = findName(DB.positions, 'position_id', e.position_id, 'position_name');
            return `
                <tr>
                    <td>${e.employee_id}</td>
                    <td>${e.first_name}</td>
                    <td>${e.last_name}</td>
                    <td>${posName}</td>
                    <td>${e.hire_date}</td>
                    <td class="action-cell">
                        <button class="btn btn-sm" onclick="editEmployee(${e.employee_id})">Ред.</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${e.employee_id})">Удал.</button>
                    </td>
                </tr>
            `;
        }).join('');

        return `
            <div class="panel-header">
                <h2>Сотрудники</h2>
                <button class="btn btn-primary" onclick="addEmployee()">+ Добавить сотрудника</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Должность</th><th>Дата приёма</th><th>Действия</th></tr></thead>
                    <tbody>${rows || '<tr class="empty-row"><td colspan="6">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
            <div id="employee-form" class="form-grid hidden"></div>
        `;
    }

    // ----- СТАНКИ -----
    function renderMachines() {
        const rows = DB.machines.map(m => {
            let badgeClass = 'badge-active';
            if (m.status === 'Maintenance') badgeClass = 'badge-maintenance';
            else if (m.status === 'Offline') badgeClass = 'badge-offline';
            return `
                <tr>
                    <td>${m.machine_id}</td>
                    <td>${m.machine_name}</td>
                    <td>${m.machine_type}</td>
                    <td><span class="badge ${badgeClass}">${m.status}</span></td>
                    <td class="action-cell">
                        <button class="btn btn-sm" onclick="editMachine(${m.machine_id})">Ред.</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMachine(${m.machine_id})">Удал.</button>
                    </td>
                </tr>
            `;
        }).join('');

        return `
            <div class="panel-header">
                <h2>Станки</h2>
                <button class="btn btn-primary" onclick="addMachine()">+ Добавить станок</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Статус</th><th>Действия</th></tr></thead>
                    <tbody>${rows || '<tr class="empty-row"><td colspan="5">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
            <div id="machine-form" class="form-grid hidden"></div>
        `;
    }

    // ----- ДЕТАЛИ -----
    function renderParts() {
        const rows = DB.parts.map(p => `
            <tr>
                <td>${p.part_id}</td>
                <td>${p.part_name}</td>
                <td>${p.material}</td>
                <td>${p.unit_price.toFixed(2)}</td>
                <td class="action-cell">
                    <button class="btn btn-sm" onclick="editPart(${p.part_id})">Ред.</button>
                    <button class="btn btn-sm btn-danger" onclick="deletePart(${p.part_id})">Удал.</button>
                </td>
            </tr>
        `).join('');

        return `
            <div class="panel-header">
                <h2>Детали</h2>
                <button class="btn btn-primary" onclick="addPart()">+ Добавить деталь</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Название</th><th>Материал</th><th>Цена за ед.</th><th>Действия</th></tr></thead>
                    <tbody>${rows || '<tr class="empty-row"><td colspan="5">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
            <div id="part-form" class="form-grid hidden"></div>
        `;
    }

    // ----- ЗАКАЗЫ -----
    function renderOrders() {
        const rows = DB.orders.map(o => `
            <tr>
                <td>${o.order_id}</td>
                <td>${o.client_name}</td>
                <td>${o.order_date}</td>
                <td>${o.due_date}</td>
                <td>${o.total_amount.toFixed(2)}</td>
                <td class="action-cell">
                    <button class="btn btn-sm" onclick="editOrder(${o.order_id})">Ред.</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteOrder(${o.order_id})">Удал.</button>
                </td>
            </tr>
        `).join('');

        return `
            <div class="panel-header">
                <h2>Заказы</h2>
                <button class="btn btn-primary" onclick="addOrder()">+ Добавить заказ</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Клиент</th><th>Дата заказа</th><th>Срок</th><th>Сумма</th><th>Действия</th></tr></thead>
                    <tbody>${rows || '<tr class="empty-row"><td colspan="6">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
            <div id="order-form" class="form-grid hidden"></div>
        `;
    }

    // ----- СМЕННЫЕ ЗАДАНИЯ -----
    function renderShiftTasks() {
        const rows = DB.shiftTasks.map(t => {
            const emp = findName(DB.employees, 'employee_id', t.employee_id, 'last_name') + ' ' + findName(DB.employees, 'employee_id', t.employee_id, 'first_name');

            const emp = DB.employees.find(e => e.employee_id === t.employee_id);
            const mach = DB.machines.find(m => m.machine_id === t.machine_id);
            const part = DB.parts.find(p => p.part_id === t.part_id);
            const ord = DB.orders.find(o => o.order_id === t.order_id);
            return {
                task_id: t.task_id,
                employee_name: emp ? emp.last_name + ' ' + emp.first_name : '—',
                machine_name: mach ? mach.machine_name : '—',
                part_name: part ? part.part_name : '—',
                client_name: ord ? ord.client_name : '—',
                shift_date: t.shift_date,
                planned_quantity: t.planned_quantity,
                actual_quantity: t.actual_quantity
            };
        }).sort((a, b) => b.shift_date.localeCompare(a.shift_date) || a.task_id - b.task_id);

        let html = `<table><thead><tr>
            <th>ID</th><th>Сотрудник</th><th>Станок</th><th>Деталь</th><th>Клиент</th><th>Дата смены</th><th>План</th><th>Факт</th>
        </tr></thead><tbody>`;
        if (!result.length) html += `<tr class="empty-row"><td colspan="8">Нет данных</td></tr>`;
        else result.forEach(r => {
            html += `<tr>
                <td>${r.task_id}</td><td>${r.employee_name}</td><td>${r.machine_name}</td>
                <td>${r.part_name}</td><td>${r.client_name}</td><td>${r.shift_date}</td>
                <td>${r.planned_quantity}</td><td>${r.actual_quantity}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        const container = document.getElementById('query7-result');
        container.innerHTML = html;
        container.classList.remove('hidden');
    }

    function runQuery8() {
        const map = new Map();
        DB.machines.forEach(m => {
            map.set(m.machine_id, { machine_name: m.machine_name, status: m.status, total_planned: 0, total_actual: 0 });
        });
        DB.shiftTasks.forEach(t => {
            if (map.has(t.machine_id)) {
                const rec = map.get(t.machine_id);
                rec.total_planned += t.planned_quantity;
                rec.total_actual += t.actual_quantity;
            }
        });
        const result = Array.from(map.values()).map(r => {
            let eff = 0;
            if (r.total_planned > 0) eff = (r.total_actual / r.total_planned) * 100;
            return { ...r, efficiency_percentage: Math.round(eff * 100) / 100 };
        }).sort((a, b) => b.efficiency_percentage - a.efficiency_percentage);

        let html = `<table><thead><tr>
            <th>Станок</th><th>Статус</th><th>План (всего)</th><th>Факт (всего)</th><th>% выполнения</th>
        </tr></thead><tbody>`;
        if (!result.length) html += `<tr class="empty-row"><td colspan="5">Нет данных</td></tr>`;
        else result.forEach(r => {
            html += `<tr>
                <td>${r.machine_name}</td><td>${r.status}</td><td>${r.total_planned}</td><td>${r.total_actual}</td><td>${r.efficiency_percentage}%</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        const container = document.getElementById('query8-result');
        container.innerHTML = html;
        container.classList.remove('hidden');
    }

    function runQuery9() {
        const map = new Map();
        DB.orders.forEach(o => {
            map.set(o.order_id, { order_id: o.order_id, client_name: o.client_name, total_amount: o.total_amount, tasks_assigned: 0, total_parts_ordered: 0 });
        });
        DB.shiftTasks.forEach(t => {
            if (map.has(t.order_id)) {
                const rec = map.get(t.order_id);
                rec.tasks_assigned += 1;
                rec.total_parts_ordered += t.planned_quantity;
            }
        });
        const result = Array.from(map.values()).sort((a, b) => b.total_amount - a.total_amount);

        let html = `<table><thead><tr>
            <th>ID заказа</th><th>Клиент</th><th>Сумма</th><th>Заданий</th><th>Деталей (план)</th>
        </tr></thead><tbody>`;
        if (!result.length) html += `<tr class="empty-row"><td colspan="5">Нет данных</td></tr>`;
        else result.forEach(r => {
            html += `<tr>
                <td>${r.order_id}</td><td>${r.client_name}</td><td>${r.total_amount.toFixed(2)}</td><td>${r.tasks_assigned}</td><td>${r.total_parts_ordered}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        const container = document.getElementById('query9-result');
        container.innerHTML = html;
        container.classList.remove('hidden');
    }

    // ======================== НАВИГАЦИЯ ========================
    let currentTab = 'positions';

    function renderCurrentTab() {
        const panel = document.getElementById('panel');
        switch (currentTab) {
            case 'positions': panel.innerHTML = renderPositions(); break;
            case 'employees': panel.innerHTML = renderEmployees(); break;
            case 'machines': panel.innerHTML = renderMachines(); break;
            case 'parts': panel.innerHTML = renderParts(); break;
            case 'orders': panel.innerHTML = renderOrders(); break;
            case 'shiftTasks': panel.innerHTML = renderShiftTasks(); break;
            case 'queries': panel.innerHTML = renderQueries(); break;
            default: panel.innerHTML = renderPositions();
        }
    }

    // ======================== ИНИЦИАЛИЗАЦИЯ ========================
    document.addEventListener('DOMContentLoaded', () => {
        renderCurrentTab();

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                renderCurrentTab();
            });
        });
    });

    // Глобальные функции для onclick
    window.addPosition = addPosition;
    window.saveNewPosition = saveNewPosition;
    window.editPosition = editPosition;
    window.saveEditPosition = saveEditPosition;
    window.deletePosition = deletePosition;

    window.addEmployee = addEmployee;
    window.saveNewEmployee = saveNewEmployee;
    window.editEmployee = editEmployee;
    window.saveEditEmployee = saveEditEmployee;
    window.deleteEmployee = deleteEmployee;

    window.addMachine = addMachine;
    window.saveNewMachine = saveNewMachine;
    window.editMachine = editMachine;
    window.saveEditMachine = saveEditMachine;
    window.deleteMachine = deleteMachine;

    window.addPart = addPart;
    window.saveNewPart = saveNewPart;
    window.editPart = editPart;
    window.saveEditPart = saveEditPart;
    window.deletePart = deletePart;

    window.addOrder = addOrder;
    window.saveNewOrder = saveNewOrder;
    window.editOrder = editOrder;
    window.saveEditOrder = saveEditOrder;
    window.deleteOrder = deleteOrder;

    window.addShiftTask = addShiftTask;
    window.saveNewShiftTask = saveNewShiftTask;
    window.editShiftTask = editShiftTask;
    window.saveEditShiftTask = saveEditShiftTask;
    window.deleteShiftTask = deleteShiftTask;

    window.runQuery7 = runQuery7;
    window.runQuery8 = runQuery8;
    window.runQuery9 = runQuery9;
</script>
